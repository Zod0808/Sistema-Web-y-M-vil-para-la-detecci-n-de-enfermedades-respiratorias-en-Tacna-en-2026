[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | migrations
  | models
  | node_modules
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    'venv/',
    '__pycache__/',
    'migrations/',
    'models/',
    'node_modules/',
]

[tool.bandit]
exclude_dirs = ['venv', '__pycache__', 'migrations', 'models', 'tests']
skips = ['B101']  # Skip assert_used warnings

# La configuración real de coverage.py (omit, precision, exclude_lines) vive
# en .coveragerc. Se mantiene ahí para que también la respeten `coverage run`
# y `coverage report` invocados fuera de pytest.

