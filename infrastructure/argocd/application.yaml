---
# ArgoCD Application Configuration for RespiCare
# Aplicación principal que gestiona todos los componentes de RespiCare

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: respicare-backend
  namespace: argocd
  labels:
    app: respicare
    component: backend
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/respicare.git
    targetRevision: main
    path: infrastructure/k8s
    directory:
      recurse: false
      include: |
        backend-*.yaml
        backend-*.yml
    helm:
      valueFiles:
        - values-backend.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: respicare-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
