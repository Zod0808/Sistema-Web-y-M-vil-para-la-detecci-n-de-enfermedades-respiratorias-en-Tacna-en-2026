apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: respicare-prod
data:
  mongod.conf: |
    storage:
      dbPath: /data/db
      wiredTiger:
        engineConfig:
          cacheSizeGB: 2
    replication:
      replSetName: "respicare-rs"
    net:
      port: 27017
      bindIp: 0.0.0.0
    security:
      authorization: enabled
    setParameter:
      enableLocalhostAuthBypass: false
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secrets
  namespace: respicare-prod
type: Opaque
stringData:
  username: respicare
  password: CHANGE_ME_MONGODB_PASSWORD
  root-password: CHANGE_ME_MONGODB_ROOT_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: respicare-prod
  labels:
    app: mongodb
spec:
  type: ClusterIP
  ports:
  - port: 27017
    targetPort: 27017
    protocol: TCP
    name: mongodb
  clusterIP: None
  selector:
    app: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: respicare-prod
  labels:
    app: mongodb
spec:
  serviceName: mongodb
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        command:
        - mongod
        - --config
        - /etc/mongod.conf
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secrets
              key: username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secrets
              key: root-password
        ports:
        - containerPort: 27017
          name: mongodb
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        - name: mongodb-config
          mountPath: /etc/mongod.conf
          subPath: mongod.conf
        resources:
          requests:
            cpu: "2000m"
            memory: "4Gi"
          limits:
            cpu: "4000m"
            memory: "8Gi"
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: mongodb-config
        configMap:
          name: mongodb-config
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 100Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init-replica-set
  namespace: respicare-prod
spec:
  template:
    spec:
      containers:
      - name: init-replica-set
        image: mongo:7.0
        command:
        - mongosh
        - --host
        - mongodb-0.mongodb.respicare-prod.svc.cluster.local:27017
        - --username
        - $(MONGO_INITDB_ROOT_USERNAME)
        - --password
        - $(MONGO_INITDB_ROOT_PASSWORD)
        - --authenticationDatabase
        - admin
        - --eval
        - |
          rs.initiate({
            _id: "respicare-rs",
            members: [
              { _id: 0, host: "mongodb-0.mongodb.respicare-prod.svc.cluster.local:27017" },
              { _id: 1, host: "mongodb-1.mongodb.respicare-prod.svc.cluster.local:27017" },
              { _id: 2, host: "mongodb-2.mongodb.respicare-prod.svc.cluster.local:27017" }
            ]
          })
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secrets
              key: username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secrets
              key: root-password
      restartPolicy: OnFailure
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongodb-pdb
  namespace: respicare-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mongodb

