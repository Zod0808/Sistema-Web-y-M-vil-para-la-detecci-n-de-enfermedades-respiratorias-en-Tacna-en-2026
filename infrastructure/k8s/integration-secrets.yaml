apiVersion: v1
kind: Secret
metadata:
  name: oauth2-credentials
  namespace: respicare
  labels:
    app: respicare-backend
    component: integrations
type: Opaque
stringData:
  client-id: "CHANGE_ME"
  client-secret: "CHANGE_ME"
  token-url: "https://external-api.example.com/oauth/token"
  scope: "read write"
---
apiVersion: v1
kind: Secret
metadata:
  name: mtls-certificates
  namespace: respicare
  labels:
    app: respicare-backend
    component: integrations
type: Opaque
data:
  # Base64 encoded certificates
  # To create: cat client.crt | base64 -w 0
  client.crt: ""
  client.key: ""
  ca.crt: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: laboratory-credentials
  namespace: respicare
  labels:
    app: respicare-backend
    component: integrations
type: Opaque
stringData:
  api-url: "https://lab-api.example.com"
  api-key: "CHANGE_ME"
  format: "fhir"
---
apiVersion: v1
kind: Secret
metadata:
  name: drug-api-credentials
  namespace: respicare
  labels:
    app: respicare-backend
    component: integrations
type: Opaque
stringData:
  fda-api-key: "CHANGE_ME"
  drugbank-api-key: "CHANGE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: integration-config
  namespace: respicare
  labels:
    app: respicare-backend
    component: integrations
data:
  LABORATORY_API_URL: "https://lab-api.example.com"
  LABORATORY_FORMAT: "fhir"
  LABORATORY_ENABLE_ALERTS: "true"
  LABORATORY_ALERT_THRESHOLD: "abnormal"
  RX_NORM_BASE_URL: "https://rxnav.nlm.nih.gov/REST"
  DRUG_CACHE_ENABLED: "true"
  DRUG_CACHE_TTL: "3600000"

