apiVersion: v1
kind: Namespace
metadata:
  name: respicare-dev
  labels:
    name: respicare-dev
    environment: development
---
apiVersion: v1
kind: Namespace
metadata:
  name: respicare-staging
  labels:
    name: respicare-staging
    environment: staging
---
apiVersion: v1
kind: Namespace
metadata:
  name: respicare-prod
  labels:
    name: respicare-prod
    environment: production
---
# Resource Quotas para desarrollo
apiVersion: v1
kind: ResourceQuota
metadata:
  name: respicare-dev-quota
  namespace: respicare-dev
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "5"
    services.loadbalancers: "1"
---
# Resource Quotas para staging
apiVersion: v1
kind: ResourceQuota
metadata:
  name: respicare-staging-quota
  namespace: respicare-staging
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    persistentvolumeclaims: "8"
    services.loadbalancers: "1"
---
# Resource Quotas para producción
apiVersion: v1
kind: ResourceQuota
metadata:
  name: respicare-prod-quota
  namespace: respicare-prod
spec:
  hard:
    requests.cpu: "40"
    requests.memory: 80Gi
    limits.cpu: "80"
    limits.memory: 160Gi
    persistentvolumeclaims: "20"
    services.loadbalancers: "3"
    pods: "100"
---
# Limit Ranges para desarrollo
apiVersion: v1
kind: LimitRange
metadata:
  name: respicare-dev-limits
  namespace: respicare-dev
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
---
# Limit Ranges para staging
apiVersion: v1
kind: LimitRange
metadata:
  name: respicare-staging-limits
  namespace: respicare-staging
spec:
  limits:
  - default:
      cpu: "1000m"
      memory: "1Gi"
    defaultRequest:
      cpu: "200m"
      memory: "256Mi"
    type: Container
---
# Limit Ranges para producción
apiVersion: v1
kind: LimitRange
metadata:
  name: respicare-prod-limits
  namespace: respicare-prod
spec:
  limits:
  - default:
      cpu: "2000m"
      memory: "2Gi"
    defaultRequest:
      cpu: "500m"
      memory: "512Mi"
    type: Container
    max:
      cpu: "8000m"
      memory: "16Gi"

