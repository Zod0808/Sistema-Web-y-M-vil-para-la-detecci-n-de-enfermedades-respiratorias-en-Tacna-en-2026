# Deployment para servicios de dominios core
# Incluye configuraciones para Medical Histories, Appointments, Prescriptions, Alerts

apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-domains-service
  namespace: respicare-prod
  labels:
    app: core-domains-service
    version: v1
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: core-domains-service
  template:
    metadata:
      labels:
        app: core-domains-service
        version: v1
    spec:
      containers:
      - name: core-domains
        image: respicare/backend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: mongodb-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
# Service para core-domains
apiVersion: v1
kind: Service
metadata:
  name: core-domains-service
  namespace: respicare-prod
  labels:
    app: core-domains-service
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: core-domains-service
---
# ConfigMap para configuración de dominios core
apiVersion: v1
kind: ConfigMap
metadata:
  name: core-domains-config
  namespace: respicare-prod
data:
  medical-histories:
    cache-ttl: "3600"
    max-history-size: "10485760"  # 10MB
    enable-ai-analysis: "true"
  appointments:
    reminder-hours-before: "24,2"
    max-concurrent-appointments: "100"
    enable-optimization: "true"
  prescriptions:
    enable-interaction-check: "true"
    enable-allergy-check: "true"
    max-prescription-items: "20"
  alerts:
    priority-reassessment-interval: "300"  # 5 minutos
    max-alerts-per-patient: "50"
    enable-ai-priority: "true"
---
# Horizontal Pod Autoscaler para core-domains
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-domains-hpa
  namespace: respicare-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-domains-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
# Network Policy para core-domains
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-domains-network-policy
  namespace: respicare-prod
spec:
  podSelector:
    matchLabels:
      app: core-domains-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Permitir tráfico desde ingress
  - from:
    - namespaceSelector:
        matchLabels:
          name: istio-system
    ports:
    - protocol: TCP
      port: 3000
  # Permitir tráfico desde otros servicios del namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: respicare-prod
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Permitir conexión a MongoDB
  - to:
    - namespaceSelector:
        matchLabels:
          name: respicare-prod
    ports:
    - protocol: TCP
      port: 27017
  # Permitir conexión a Redis
  - to:
    - namespaceSelector:
        matchLabels:
          name: respicare-prod
    ports:
    - protocol: TCP
      port: 6379
  # Permitir conexión a AI Services
  - to:
    - namespaceSelector:
        matchLabels:
          name: respicare-prod
    ports:
    - protocol: TCP
      port: 8000
  # Permitir DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53

