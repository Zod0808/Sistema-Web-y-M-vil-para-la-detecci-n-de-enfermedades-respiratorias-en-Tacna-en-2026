# Configuración de TLS/SSL para Seguridad Base
# Incluye cert-manager, ClusterIssuers y certificados TLS

---
# ClusterIssuer para Let's Encrypt (Staging - para pruebas)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@respicare.dev  # Cambiar por email real
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
    - http01:
        ingress:
          class: nginx
---
# ClusterIssuer para Let's Encrypt (Production)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@respicare.dev  # Cambiar por email real
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx
---
# Certificate para Backend API
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backend-api-tls
  namespace: respicare-prod
spec:
  secretName: backend-api-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - api.respicare.dev
  - api.respicare.prod
---
# Certificate para Web Frontend
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-frontend-tls
  namespace: respicare-prod
spec:
  secretName: web-frontend-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - respicare.dev
  - www.respicare.dev
---
# Certificate para AI Services
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ai-services-tls
  namespace: respicare-prod
spec:
  secretName: ai-services-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - ai.respicare.dev
  - ai-api.respicare.dev
---
# ConfigMap para configuración TLS global
apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-security-config
  namespace: respicare-prod
data:
  tls-min-version: "1.2"
  tls-max-version: "1.3"
  tls-cipher-suites: "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
  hsts-max-age: "31536000"  # 1 año
  hsts-include-subdomains: "true"
  hsts-preload: "true"

