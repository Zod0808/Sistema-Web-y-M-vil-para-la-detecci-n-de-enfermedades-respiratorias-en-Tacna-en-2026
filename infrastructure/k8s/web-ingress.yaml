apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # SSL/TLS Configuration
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    # Cache Headers para Assets Estáticos
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Cache headers para assets estáticos (JS, CSS, imágenes, fuentes)
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
      }
      # Cache headers para HTML (corto, para permitir actualizaciones)
      location ~* \.(html)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
      }
      # Cache headers para manifest.json y otros archivos de configuración
      location ~* \.(json|xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public";
      }
      # CDN Headers (si se usa CDN externo)
      more_set_headers "X-CDN-Enabled: true";
      more_set_headers "X-Asset-Version: $time_iso8601";
    # Compression
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range"
    nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range"
spec:
  tls:
    - hosts:
        - respicare.example.com
        - www.respicare.example.com
      secretName: web-tls
  rules:
    - host: respicare.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: www.respicare.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80

