---
# Canary Deployment Configuration for RespiCare
# Configuración para despliegues progresivos (Canary) con Istio y Nginx Ingress

# ============================================================================
# Canary Deployment usando Istio VirtualService
# ============================================================================

apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: backend-canary
  namespace: respicare-prod
  labels:
    app: backend
    version: canary
spec:
  hosts:
    - backend.respicare.example.com
  http:
    # Tráfico a versión estable (90%)
    - match:
        - headers:
            canary:
              exact: "false"
      route:
        - destination:
            host: backend
            subset: stable
          weight: 90
        - destination:
            host: backend
            subset: canary
          weight: 10
    # Tráfico a versión canary (10%)
    - match:
        - headers:
            canary:
              exact: "true"
      route:
        - destination:
            host: backend
            subset: canary
          weight: 100
    # Fallback: distribución 90/10
    - route:
        - destination:
            host: backend
            subset: stable
          weight: 90
        - destination:
            host: backend
            subset: canary
          weight: 10
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: backend
  namespace: respicare-prod
spec:
  host: backend
  subsets:
    - name: stable
      labels:
        version: stable
    - name: canary
      labels:
        version: canary
---
# ============================================================================
# Canary Deployment usando Nginx Ingress (alternativa sin Istio)
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-canary
  namespace: respicare-prod
  labels:
    app: backend
    version: canary
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      version: canary
      track: canary
  template:
    metadata:
      labels:
        app: backend
        version: canary
        track: canary
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/respicare-backend:canary
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: FEATURE_FLAG_PROVIDER
              value: "memory"
            - name: CANARY_DEPLOYMENT
              value: "true"
            - name: FIELD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: field_encryption_key
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: mongodb_uri
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt_secret
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-canary
  namespace: respicare-prod
  labels:
    app: backend
    version: canary
    track: canary
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
      name: http
  selector:
    app: backend
    version: canary
    track: canary
---
# Ingress con canary annotations (Nginx Ingress Controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-canary
  namespace: respicare-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Canary annotations
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"  # 10% del tráfico
    # nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"  # Por header
    # nginx.ingress.kubernetes.io/canary-by-header-value: "true"  # Valor del header
    # nginx.ingress.kubernetes.io/canary-by-cookie: "canary"  # Por cookie
    # SSL/TLS
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Health checks
    nginx.ingress.kubernetes.io/upstream-max-fails: "3"
    nginx.ingress.kubernetes.io/upstream-fail-timeout: "30s"
spec:
  tls:
    - hosts:
        - api-canary.respicare.example.com
      secretName: backend-tls
  rules:
    - host: api-canary.respicare.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-canary
                port:
                  number: 80
---
# ============================================================================
# Flagger para Canary Deployments Automáticos
# ============================================================================

apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: backend
  namespace: respicare-prod
  labels:
    app: backend
spec:
  # Servicio objetivo
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  # Servicio que expone el canary
  service:
    port: 80
    targetPort: 3001
    portName: http
    # Headers para análisis
    headers:
      request:
        add:
          X-Canary: "true"
      response:
        add:
          X-Canary-Version: "canary"
  # Análisis de métricas
  analysis:
    # Intervalo entre análisis
    interval: 1m
    # Número de checks antes de promocionar
    threshold: 5
    # Máximo número de checks
    maxWeight: 50
    # Pasos de incremento de tráfico
    stepWeight: 10
    # Métricas para análisis
    metrics:
      - name: request-success-rate
        interval: 1m
        thresholdRange:
          min: 99
      - name: request-duration
        interval: 1m
        thresholdRange:
          max: 500
      - name: error-rate
        interval: 1m
        thresholdRange:
          max: 1
    # Webhooks para validación
    webhooks:
      - name: load-test
        type: pre-rollout
        url: http://flagger-loadtester.test/
        timeout: 5s
        metadata:
          type: "bash"
          cmd: "hey -z 1m -q 10 -c 2 http://backend-canary.respicare-prod/"
      - name: acceptance-test
        type: pre-rollout
        url: http://flagger-loadtester.test/
        timeout: 5s
        metadata:
          type: "bash"
          cmd: "curl -f http://backend-canary.respicare-prod/health || exit 1"
      - name: notify
        type: post-rollout
        url: http://flagger-notifier.test/
        timeout: 3s
        metadata:
          type: "slack"
          channel: "#deployments"
          message: "Backend canary deployment {{ .Status.Phase }}"
  # Configuración de progresión
  progressDeadlineSeconds: 600
  # Revertir automáticamente en caso de fallo
  revertOnDeletion: true
---
# ============================================================================
# ServiceMonitor para métricas de Prometheus
# ============================================================================

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-canary
  namespace: respicare-prod
  labels:
    app: backend
    version: canary
spec:
  selector:
    matchLabels:
      app: backend
      version: canary
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
# ============================================================================
# HorizontalPodAutoscaler para Canary
# ============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-canary-hpa
  namespace: respicare-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-canary
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 1
          periodSeconds: 30
      selectPolicy: Max
---
# ============================================================================
# PodDisruptionBudget para Canary
# ============================================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-canary-pdb
  namespace: respicare-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
      version: canary
      track: canary
---
# ============================================================================
# ConfigMap para configuración de Canary
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-config
  namespace: respicare-prod
data:
  canary.yaml: |
    # Configuración de canary deployment
    analysis:
      interval: 60s
      threshold: 5
      maxWeight: 50
      stepWeight: 10
      metrics:
        - name: request-success-rate
          threshold: 99
        - name: request-duration
          threshold: 500ms
        - name: error-rate
          threshold: 1%
    # Rollout automático
    autoPromote: false
    autoRollback: true
    # Notificaciones
    notifications:
      slack:
        enabled: true
        webhook: ${SLACK_WEBHOOK_URL}
      email:
        enabled: false
  rollout-strategy.yaml: |
    # Estrategia de rollout
    steps:
      - weight: 10
        duration: 5m
      - weight: 25
        duration: 10m
      - weight: 50
        duration: 15m
      - weight: 100
        duration: 20m

