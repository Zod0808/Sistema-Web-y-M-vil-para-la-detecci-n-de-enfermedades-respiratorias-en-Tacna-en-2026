# Configuración de External Secrets Operator
# Para gestionar secretos de forma segura desde proveedores externos (AWS Secrets Manager, Vault, etc.)

---
# SecretStore para AWS Secrets Manager (ejemplo)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-store
  namespace: respicare-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
# ExternalSecret para MongoDB URI desde AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongodb-uri-secret
  namespace: respicare-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        mongodb-uri: "{{ .mongodb_uri }}"
  data:
  - secretKey: mongodb_uri
    remoteRef:
      key: respicare/mongodb/uri
      property: connection_string
---
# ExternalSecret para JWT Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-secrets
  namespace: respicare-prod
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        jwt-secret: "{{ .jwt_secret }}"
        jwt-refresh-secret: "{{ .jwt_refresh_secret }}"
  data:
  - secretKey: jwt_secret
    remoteRef:
      key: respicare/auth/jwt
      property: secret
  - secretKey: jwt_refresh_secret
    remoteRef:
      key: respicare/auth/jwt
      property: refresh_secret
---
# ExternalSecret para Field Encryption Key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: encryption-key-secret
  namespace: respicare-prod
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        field-encryption-key: "{{ .field_encryption_key }}"
  data:
  - secretKey: field_encryption_key
    remoteRef:
      key: respicare/encryption/field
      property: key
---
# ServiceAccount para External Secrets Operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: respicare-prod
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/external-secrets-role
---
# ClusterSecretStore para uso global (opcional)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: global-aws-secrets-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: respicare-prod

