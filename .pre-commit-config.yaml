# Pre-commit hooks - Pipeline de Seguridad de Cadena de Suministro (CSS) - RespiCare
# Ejecuta TruffleHog para detectar secretos antes de cada commit.
# Instalacion:  pre-commit install
# Ejecucion manual: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog - deteccion de secretos (via Docker)
        entry: docker run --rm -v .:/repo trufflesecurity/trufflehog:3.82.6 git file:///repo --since-commit HEAD --only-verified --fail
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: Gitleaks - deteccion de secretos (complementario)