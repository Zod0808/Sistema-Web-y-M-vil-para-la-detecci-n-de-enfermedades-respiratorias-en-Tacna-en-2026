# Overlay for docker-compose.dev.yml — adds nginx + cloudflared quick tunnel.
# Usage:
#   docker compose -f docker-compose.dev.yml -f docker-compose.tunnel.yml up -d nginx cloudflared

services:
  nginx:
    image: nginx:alpine
    container_name: respicare-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.tunnel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - ai-services
    networks:
      - respicare-dev-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: respicare-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    networks:
      - respicare-dev-network

networks:
  respicare-dev-network:
    external: true
    name: proyecto-final-sistema_enfermedades_respiratorias_respicare-dev-network
