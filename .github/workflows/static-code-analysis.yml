name: Static Code Analysis

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    # Ejecutar análisis completo cada domingo a las 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  backend-analysis:
    name: Backend Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint
        continue-on-error: true
      
      - name: Run TypeScript type check
        working-directory: ./backend
        run: npm run type-check
        continue-on-error: true
      
      - name: Run Prettier check
        working-directory: ./backend
        run: npm run format:check
        continue-on-error: true
      
      - name: Run npm audit
        working-directory: ./backend
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Upload ESLint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-eslint-results
          path: backend/eslint-report.json
          if-no-files-found: ignore

  ai-services-analysis:
    name: AI Services Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-services/requirements*.txt
      
      - name: Install dependencies
        working-directory: ./ai-services
        run: |
          pip install -r requirements.txt
          pip install -r requirements-lint.txt
      
      - name: Run Pylint
        working-directory: ./ai-services
        run: |
          pylint --rcfile=.pylintrc --output-format=json api/ core/ services/ ml_models/ > pylint-report.json || true
        continue-on-error: true
      
      - name: Run Flake8
        working-directory: ./ai-services
        run: |
          flake8 --config=.flake8 api/ core/ services/ ml_models/ || true
        continue-on-error: true
      
      - name: Run Black check
        working-directory: ./ai-services
        run: |
          black --check api/ core/ services/ ml_models/ || true
        continue-on-error: true
      
      - name: Run mypy
        working-directory: ./ai-services
        run: |
          mypy api/ core/ services/ ml_models/ || true
        continue-on-error: true
      
      - name: Run Bandit security scan
        working-directory: ./ai-services
        run: |
          bandit -r api/ core/ services/ ml_models/ -f json -o bandit-report.json || true
        continue-on-error: true
      
      - name: Run pip-audit
        working-directory: ./ai-services
        run: |
          pip-audit --format json --output audit-report.json || true
        continue-on-error: true
      
      - name: Upload analysis reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-services-analysis-reports
          path: |
            ai-services/pylint-report.json
            ai-services/bandit-report.json
            ai-services/audit-report.json
          if-no-files-found: ignore

  frontend-analysis:
    name: Frontend Web Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Install dependencies
        working-directory: ./web
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./web
        run: |
          if command -v eslint &> /dev/null || npx eslint --version &> /dev/null; then
            npx eslint src/ --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json || true
          else
            echo "ESLint not available, skipping lint check"
            echo "[]" > eslint-report.json
          fi
        continue-on-error: true
      
      - name: Run TypeScript type check
        working-directory: ./web
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit || true
          else
            echo "No tsconfig.json found, skipping type check"
          fi
        continue-on-error: true
      
      - name: Run npm audit
        working-directory: ./web
        run: npm audit --audit-level=moderate || true
        continue-on-error: true
      
      - name: Upload ESLint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-eslint-results
          path: web/eslint-report.json
          if-no-files-found: ignore

  mobile-analysis:
    name: Mobile App Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          check-latest: true
      
      - name: Determine mobile project structure
        id: mobile-structure
        run: |
          if [ -f "mobile/medical-app/package.json" ]; then
            echo "project_path=mobile/medical-app" >> $GITHUB_OUTPUT
            echo "lockfile_path=mobile/medical-app/package-lock.json" >> $GITHUB_OUTPUT
          elif [ -f "mobile/package.json" ]; then
            echo "project_path=mobile" >> $GITHUB_OUTPUT
            echo "lockfile_path=mobile/package-lock.json" >> $GITHUB_OUTPUT
          else
            echo "Error: No mobile package.json found"
            exit 1
          fi
      
      - name: Install dependencies
        working-directory: ./${{ steps.mobile-structure.outputs.project_path }}
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "Warning: package-lock.json not found, generating it..."
            npm install --package-lock-only
          fi
          npm ci
      
      - name: Run ESLint
        working-directory: ./${{ steps.mobile-structure.outputs.project_path }}
        run: |
          if npm run | grep -q "lint"; then
            npm run lint -- --format json --output-file eslint-report.json || true
          else
            npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json || true
          fi
        continue-on-error: true
      
      - name: Run TypeScript type check
        working-directory: ./${{ steps.mobile-structure.outputs.project_path }}
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit || true
          else
            echo "No tsconfig.json found, skipping type check"
          fi
        continue-on-error: true
      
      - name: Run npm audit
        working-directory: ./${{ steps.mobile-structure.outputs.project_path }}
        run: npm audit --audit-level=moderate || true
        continue-on-error: true
      
      - name: Upload ESLint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-eslint-results
          path: ${{ steps.mobile-structure.outputs.project_path }}/eslint-report.json
          if-no-files-found: ignore

  generate-report:
    name: Generate Analysis Report
    runs-on: ubuntu-latest
    needs: [backend-analysis, ai-services-analysis, frontend-analysis, mobile-analysis]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: analysis-reports
      
      - name: Generate summary
        run: |
          echo "## 📊 Static Code Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- npm audit: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### AI Services Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Pylint: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Flake8: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Bandit: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- pip-audit: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend Web Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- npm audit: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Mobile App Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- npm audit: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📝 Ver reporte completo en: [docs/STATIC_CODE_ANALYSIS.md](docs/STATIC_CODE_ANALYSIS.md)" >> $GITHUB_STEP_SUMMARY

