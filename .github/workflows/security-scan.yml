name: Security Pipeline CSS

# Pipeline de Seguridad de Cadena de Suministro de Software (CSS) - RespiCare
# Trivy (SCA) + Syft (SBOM) + Semgrep (SAST) + Cosign (firma de artefactos)
# Todas las GitHub Actions estan fijadas por SHA de commit (supply-chain hardening).

on:
  push:
    branches: [main, develop, fabian]
  pull_request:
    branches: [main, fabian]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy FS vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          output: trivy-fs-results.txt

      - name: Upload Trivy FS results
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: trivy-fs-results
          path: trivy-fs-results.txt

  # ---------------------------------------------------------------------------
  trivy-image-scan:
    name: Trivy Docker Image Scan (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: trivy-fs-scan
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: ai
            context: ./ai-services
            dockerfile: ./ai-services/Dockerfile.prod
          - name: nginx
            context: ./nginx
            dockerfile: ./nginx/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build ${{ matrix.service.name }} Docker image
        run: docker build -f ${{ matrix.service.dockerfile }} -t respicare-${{ matrix.service.name }}:scan ${{ matrix.service.context }}

      - name: Run Trivy image scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: respicare-${{ matrix.service.name }}:scan
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          output: trivy-image-${{ matrix.service.name }}-results.txt

      - name: Upload Trivy image results
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: trivy-image-results-${{ matrix.service.name }}
          path: trivy-image-${{ matrix.service.name }}-results.txt

  # ---------------------------------------------------------------------------
  sbom-generation:
    name: Generate SBOM (Syft / CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@55dc4ee22412511ee8c3142cbea40418e6cec693 # v0.17.8

      - name: Generate SBOM
        run: |
          syft dir:. -o cyclonedx-json > sbom-respicare.cdx.json
          echo "Componentes: $(cat sbom-respicare.cdx.json | jq '.components | length')"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom-cyclonedx
          path: sbom-respicare.cdx.json

  # ---------------------------------------------------------------------------
  semgrep-sast:
    name: Semgrep SAST Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep
        run: semgrep scan --config=p/security-audit --config=p/nodejs --config=p/python --config=p/typescript --error --sarif --output=semgrep.sarif || true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: semgrep-results
          path: semgrep.sarif

  # ---------------------------------------------------------------------------
  sign-image:
    name: Sign Container with Cosign (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: [trivy-image-scan, sbom-generation]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: ai
            context: ./ai-services
            dockerfile: ./ai-services/Dockerfile.prod
          - name: nginx
            context: ./nginx
            dockerfile: ./nginx/Dockerfile
    permissions:
      contents: read
      id-token: write   # requerido para OIDC keyless de Sigstore
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }} image
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$REPO_LC/${{ matrix.service.name }}
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f ${{ matrix.service.dockerfile }} -t $IMAGE:${{ github.sha }} ${{ matrix.service.context }}
          docker push $IMAGE:${{ github.sha }}

      - name: Sign with Cosign (keyless / OIDC)
        run: |
          cosign sign --yes $IMAGE:${{ github.sha }}
