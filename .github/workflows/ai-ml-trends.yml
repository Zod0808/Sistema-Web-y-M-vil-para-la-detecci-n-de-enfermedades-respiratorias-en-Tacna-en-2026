name: AI Services - Análisis de Tendencias de Predicciones

on:
  workflow_dispatch:
  push:
    paths:
      - "ai-services/**"
      - ".github/workflows/ai-ml-trends.yml"

jobs:
  analyze-trends:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ai-services/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Run trends analysis (últimos 30 días)
        run: |
          python scripts/analysis/analyze_prediction_trends.py --logs-dir monitoring --days 30 --confidence-threshold 0.8

      - name: Collect trend artifacts
        run: |
          mkdir -p artifacts
          cp prediction_trends_*.csv artifacts/ || true
          cp prediction_trends_*.md artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-prediction-trends
          path: ai-services/artifacts


