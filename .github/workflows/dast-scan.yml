name: DAST Security Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL objetivo para escanear (ej: https://api.respicare.dev)"
        required: false
        default: "http://localhost:3001"
      scan_type:
        description: "Tipo de escaneo"
        required: false
        default: "baseline"
        type: choice
        options:
          - baseline
          - full-scan
          - api-scan
  schedule:
    # Ejecutar escaneo completo semanalmente (lunes 2 AM UTC)
    - cron: '0 2 * * 1'
  push:
    branches: [ master, main ]
    paths:
      - 'backend/src/**'
      - '.github/workflows/dast-scan.yml'

env:
  BACKEND_PORT: 3001
  AI_SERVICES_PORT: 8000

jobs:
  start-backend:
    name: Start Backend for DAST
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Start backend server (development mode)
        id: start-backend
        working-directory: ./backend
        run: |
          echo "🚀 Starting backend server in development mode..."
          echo "Current directory: $(pwd)"
          echo "Checking if src/index-dev.js exists:"
          ls -la src/index-dev.js || echo "⚠️ index-dev.js not found!"
          echo "Killing any existing node processes (just in case):"
          pkill -f "node.*index" || echo "No existing processes found"
          echo "Running backend with: node src/index-dev.js"
          node src/index-dev.js > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Backend PID: $(cat backend.pid)"
          sleep 3
          echo "Checking backend process:"
          ps aux | grep "[n]ode src/index-dev.js" || echo "⚠️ Process not found!"
          echo "Last 30 lines of backend.log:"
          tail -30 backend.log || echo "⚠️ Log file not created yet"
        env:
          NODE_ENV: development
          PORT: ${{ env.BACKEND_PORT }}
          MONGODB_URI: mongodb://localhost:27017/respicare-test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-dast-scan-change-in-production
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-dast-scan-change-in-production
          SMTP_HOST: smtp.example.com
          SMTP_PORT: '587'
          SMTP_USER: test@example.com
          SMTP_PASS: test-password
          PUSH_PROVIDER: none
          AI_SERVICE_URL: http://localhost:8000
          LOG_LEVEL: info
          HOST: localhost
      
      - name: Wait for backend to be ready
        run: |
          echo "⏳ Waiting for backend to be ready..."
          timeout=60
          elapsed=0
          while ! curl -f http://localhost:${{ env.BACKEND_PORT }}/api/v1/health > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "❌ Backend failed to start within $timeout seconds"
              echo "📋 Backend logs:"
              if [ -f backend/backend.log ]; then
                echo "=== Full backend.log ==="
                cat backend/backend.log
                echo "=== End of backend.log ==="
              else
                echo "⚠️ backend.log file not found!"
              fi
              echo "📋 Checking for running processes:"
              ps aux | grep node || echo "No node processes found"
              echo "📋 Checking backend.pid:"
              if [ -f backend/backend.pid ]; then
                cat backend/backend.pid
              else
                echo "⚠️ backend.pid not found!"
              fi
              exit 1
            fi
            echo "⏳ Waiting for backend to start... ($elapsed/$timeout seconds)"
            sleep 2
            elapsed=$((elapsed+2))
          done
          echo "✅ Backend is ready!"
      
      - name: Verify backend health
        run: |
          echo "🔍 Verifying backend health endpoint..."
          curl -f http://localhost:${{ env.BACKEND_PORT }}/api/v1/health
          echo ""
          echo "✅ Backend health check passed"

  zap-baseline-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'baseline' || github.event.inputs.scan_type == '' || github.event_name == 'schedule' || github.event_name == 'push'
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine target URL
        id: target
        run: |
          if [ -n "${{ github.event.inputs.target_url }}" ]; then
            echo "target=${{ github.event.inputs.target_url }}" >> $GITHUB_OUTPUT
            echo "needs_backend=false" >> $GITHUB_OUTPUT
          else
            echo "target=http://localhost:${{ env.BACKEND_PORT }}" >> $GITHUB_OUTPUT
            echo "needs_backend=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        if: steps.target.outputs.needs_backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        if: steps.target.outputs.needs_backend == 'true'
        working-directory: ./backend
        run: npm ci
      
      - name: Start backend server (development mode)
        if: steps.target.outputs.needs_backend == 'true'
        working-directory: ./backend
        run: |
          echo "🚀 Starting backend server in development mode..."
          npm run dev > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Backend PID: $(cat backend.pid)"
          sleep 5
        env:
          NODE_ENV: development
          PORT: ${{ env.BACKEND_PORT }}
          MONGODB_URI: mongodb://localhost:27017/respicare-test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-dast-scan-change-in-production
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-dast-scan-change-in-production
          SMTP_HOST: smtp.example.com
          SMTP_PORT: '587'
          SMTP_USER: test@example.com
          SMTP_PASS: test-password
          PUSH_PROVIDER: none
          AI_SERVICE_URL: http://localhost:8000
          LOG_LEVEL: info
          HOST: localhost
      
      - name: Wait for backend to be ready
        if: steps.target.outputs.needs_backend == 'true'
        run: |
          echo "⏳ Waiting for backend to be ready..."
          timeout=60
          elapsed=0
          while ! curl -f http://localhost:${{ env.BACKEND_PORT }}/api/v1/health > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "❌ Backend failed to start within $timeout seconds"
              echo "📋 Backend logs:"
              if [ -f backend/backend.log ]; then
                tail -100 backend/backend.log
              fi
              exit 1
            fi
            echo "⏳ Waiting for backend to start... ($elapsed/$timeout seconds)"
            sleep 2
            elapsed=$((elapsed+2))
          done
          echo "✅ Backend is ready!"
      
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        continue-on-error: true
        with:
          target: ${{ steps.target.outputs.target }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -m 5 -I'
          fail_action: false
      
      - name: Upload ZAP HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report-html
          path: report_html.html
          retention-days: 30
      
      - name: Upload ZAP Markdown report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report-md
          path: report_md.md
          retention-days: 30
      
      - name: Upload ZAP JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report-json
          path: report_json.json
          retention-days: 30
      
      - name: Upload ZAP SARIF report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report-sarif
          path: report_json.sarif
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload ZAP results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: report_json.sarif
          wait-for-processing: true
        continue-on-error: true
      
      - name: Comment PR with ZAP results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('report_md.md')) {
              const report = fs.readFileSync('report_md.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔒 OWASP ZAP Baseline Scan Results\n\n${report}`
              });
            }

  zap-full-scan:
    name: OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    needs: start-backend
    if: github.event.inputs.scan_type == 'full-scan' || github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: ${{ github.event.inputs.target_url || format('http://localhost:{0}', env.BACKEND_PORT) }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -m 5 -I'
          fail_action: false
      
      - name: Upload ZAP HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-full-report-html
          path: report_html.html
          retention-days: 30
      
      - name: Upload ZAP Markdown report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-full-report-md
          path: report_md.md
          retention-days: 30
      
      - name: Upload ZAP JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-full-report-json
          path: report_json.json
          retention-days: 30
      
      - name: Upload ZAP SARIF report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-full-report-sarif
          path: report_json.sarif
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload ZAP results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: report_json.sarif
          wait-for-processing: true
        continue-on-error: true

  zap-api-scan:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest
    needs: start-backend
    if: github.event.inputs.scan_type == 'api-scan'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download OpenAPI spec
        run: |
          curl -f http://localhost:${{ env.BACKEND_PORT }}/api-docs/openapi.yaml -o openapi.yaml || \
          curl -f http://localhost:${{ env.BACKEND_PORT }}/api/v1/docs/openapi.yaml -o openapi.yaml || \
          echo "OpenAPI spec not found, using default API endpoints"
        continue-on-error: true
      
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          format: openapi
          target: ${{ github.event.inputs.target_url || format('http://localhost:{0}', env.BACKEND_PORT) }}
          api_spec: openapi.yaml
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -m 5 -I'
          fail_action: false
        continue-on-error: true
      
      - name: Upload ZAP HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-api-report-html
          path: report_html.html
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload ZAP Markdown report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-api-report-md
          path: report_md.md
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload ZAP JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-api-report-json
          path: report_json.json
          retention-days: 30
          if-no-files-found: ignore

  trivy-container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker images
        run: |
          docker build -t respicare-backend:test -f backend/Dockerfile backend/
          docker build -t respicare-ai-services:test -f ai-services/Dockerfile.prod ai-services/
        continue-on-error: true
      
      - name: Run Trivy vulnerability scanner on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'respicare-backend:test'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true
      
      - name: Run Trivy vulnerability scanner on AI services
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'respicare-ai-services:test'
          format: 'sarif'
          output: 'trivy-ai-services.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          wait-for-processing: true
        continue-on-error: true
      
      - name: Upload Trivy AI Services results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-ai-services.sarif
          wait-for-processing: true
        continue-on-error: true
      
      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-container-reports
          path: |
            trivy-backend.sarif
            trivy-ai-services.sarif
          retention-days: 30
          if-no-files-found: ignore

  generate-dast-summary:
    name: Generate DAST Summary
    runs-on: ubuntu-latest
    needs: [zap-baseline-scan, zap-full-scan, zap-api-scan, trivy-container-scan]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 🔒 DAST Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scans Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ OWASP ZAP Baseline Scan" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ OWASP ZAP Full Scan (scheduled/weekly)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ OWASP ZAP API Scan (on demand)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Trivy Container Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📝 Ver reportes completos en los artifacts y en GitHub Security tab." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Nota:** Los escaneos ZAP requieren que el backend esté ejecutándose." >> $GITHUB_STEP_SUMMARY
          echo "Para escanear una URL externa, usa el workflow_dispatch con el parámetro \`target_url\`." >> $GITHUB_STEP_SUMMARY

