name: Build Docker Images on Tags (Backend/Web)

on:
  push:
    tags:
      - "backend-*"
      - "web-*"
      - "release-*"
  workflow_dispatch:

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'backend-') || startsWith(github.ref_name, 'release-')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            backend:${{ github.ref_name }}
            backend:latest
          outputs: type=docker,dest=/tmp/backend-image.tar

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image-${{ github.ref_name }}
          path: /tmp/backend-image.tar

  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'web-') || startsWith(github.ref_name, 'release-')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: |
            web:${{ github.ref_name }}
            web:latest
          outputs: type=docker,dest=/tmp/web-image.tar

      - name: Upload web image artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-docker-image-${{ github.ref_name }}
          path: /tmp/web-image.tar


