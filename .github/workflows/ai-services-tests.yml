name: AI Services - Tests

on:
  push:
    paths:
      - 'ai-services/**'
      - '.github/workflows/ai-services-tests.yml'
  pull_request:
    paths:
      - 'ai-services/**'
      - '.github/workflows/ai-services-tests.yml'

jobs:
  ai-services-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./ai-services
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          if [ -f "requirements-test.txt" ]; then
            pip install -r requirements-test.txt
          fi

      - name: Run tests (pytest with coverage)
        working-directory: ./ai-services
        env:
          PYTHONPATH: ${{ github.workspace }}/ai-services
          TESTING: "true"
          AI_RATE_LIMIT_ENABLED: "0"
          CACHE_ENABLED: "false"
          CIRCUIT_BREAKER_ENABLED: "false"
        continue-on-error: true
        run: |
          pytest -q \
            --junitxml=junit.xml \
            --cov=./ \
            --cov-config=.coveragerc \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --ignore=tests/performance \
            --ignore=tests/security \
            --ignore=tests/ml_models/test_lazy_loader.py \
            --ignore=tests/patterns/test_decorator_pattern.py \
            --ignore=tests/test_model_predictions.py || echo "⚠️ Some tests failed, but continuing to check coverage..."
      
      - name: Verify coverage threshold
        working-directory: ./ai-services
        run: |
          if [ -f coverage.xml ]; then
            echo "Checking coverage threshold..."
            python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import sys
          
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              coverage_rate = float(root.attrib.get('line-rate', 0))
              coverage_percent = coverage_rate * 100
              
              print(f"Coverage: {coverage_percent:.2f}%")
              
              if coverage_percent < 35:
                  print(f"❌ Coverage {coverage_percent:.2f}% is below threshold of 35%")
                  sys.exit(1)
              else:
                  print(f"✅ Coverage {coverage_percent:.2f}% meets threshold of 35%")
                  sys.exit(0)
          except Exception as e:
              print(f"Error reading coverage.xml: {e}")
              sys.exit(1)
          EOF
          else
            echo "❌ coverage.xml not found"
            exit 1
          fi

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: ai-services-test-reports
          path: |
            ai-services/junit.xml
            ai-services/coverage.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ai-services/coverage.xml
          fail_ci_if_error: false
          verbose: true


