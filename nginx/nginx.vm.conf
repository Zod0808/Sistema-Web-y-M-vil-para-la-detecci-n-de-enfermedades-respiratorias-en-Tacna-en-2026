# La URL de Vercel supera los 64 bytes del bucket por defecto
map_hash_bucket_size 128;

# Mapa de orígenes permitidos (frontend Vercel + servidor propio)
# $cors_origin es vacío si el origen no está en la lista → no se envía la cabecera
map $http_origin $cors_origin {
    default                                              "";
    # Vercel (cualquier deployment del proyecto)
    ~^https://[a-z0-9-]+\.vercel\.app$                  "$http_origin";
    # Capacitor Android (androidScheme: https + fallback)
    "https://localhost"                                  "$http_origin";
    "capacitor://localhost"                              "$http_origin";
    "http://localhost"                                   "$http_origin";
    # Cloudflare Tunnel
    "https://sensors-contain-kingdom-nails.trycloudflare.com" "$http_origin";
    # IPs / dominios del servidor
    "http://38.250.158.233"                              "$http_origin";
    "http://respicare.sytes.net"                         "$http_origin";
    "https://respicare.sytes.net"                        "$http_origin";
}

upstream backend {
    server backend:3001;
}

upstream ai_service {
    server ai-services:8000;
}

upstream mongo_express {
    server mongo-express:8081;
}

upstream redis_commander {
    server redis-commander:8081;
}

server {
    listen 80;
    server_name 38.250.158.233 respicare.sytes.net localhost _;

    client_max_body_size 10M;

    # ── Backend REST API ──────────────────────────────
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Methods     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers     'Authorization, Content-Type, Accept';
            add_header Access-Control-Allow-Credentials 'true';
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;

        # Eliminar CORS del backend para que nginx envíe solo uno
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
    }

    # ── WebSocket / Socket.io ─────────────────────────
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
    }

    # ── WebSocket directo (/ws/) ──────────────────────
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
    }

    # ── AI / ML Service ───────────────────────────────
    location /ai/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Methods     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers     'Authorization, Content-Type, Accept';
            add_header Access-Control-Allow-Credentials 'true';
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://ai_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers     'Authorization, Content-Type, Accept' always;
        add_header Access-Control-Allow-Credentials 'true' always;
    }

    # ── MongoDB Express ───────────────────────────────
    location /mongo-express {
        proxy_pass http://mongo_express;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Redis Commander ───────────────────────────────
    location /redis-commander/ {
        proxy_pass http://redis_commander/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── AI OpenAPI spec (para Swagger UI en /ai/docs) ─
    location = /openapi.json {
        proxy_pass http://ai_service/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin $cors_origin always;
    }

    # ── Health check público ──────────────────────────
    location /health {
        proxy_pass http://backend/health;
        proxy_set_header X-Forwarded-Proto https;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
        access_log off;
    }

    # ── Healthcheck directo para Docker (no depende del backend) ──
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /favicon.ico { return 204; access_log off; }
    location = /robots.txt  { return 204; access_log off; }
}
