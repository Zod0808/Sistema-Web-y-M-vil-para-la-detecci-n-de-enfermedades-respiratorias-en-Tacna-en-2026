# La URL de Vercel supera los 64 bytes del bucket por defecto
map_hash_bucket_size 128;

# Mapa de orígenes permitidos (frontend Vercel + servidor propio)
# $cors_origin es vacío si el origen no está en la lista → no se envía la cabecera
map $http_origin $cors_origin {
    default                         "";
    "https://sistema-web-y-m-vil-para-la-detecci-n-de-enfermedade-6s5oygzhl.vercel.app" "$http_origin";
    "https://are-collecting-aids-females.trycloudflare.com" "$http_origin";
    "http://38.250.158.233"         "$http_origin";
    "http://respicare.sytes.net"    "$http_origin";
    "https://respicare.sytes.net"   "$http_origin";
}

upstream backend {
    server backend:3001;
}

upstream ai_service {
    server ai-services:8000;
}

server {
    listen 80;
    server_name 38.250.158.233 respicare.sytes.net localhost _;

    client_max_body_size 10M;

    # ── Backend REST API ──────────────────────────────
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Methods     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers     'Authorization, Content-Type, Accept';
            add_header Access-Control-Allow-Credentials 'true';
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers     'Authorization, Content-Type, Accept' always;
        add_header Access-Control-Allow-Credentials 'true' always;
    }

    # ── WebSocket / Socket.io ─────────────────────────
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
    }

    # ── WebSocket directo (/ws/) ──────────────────────
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials 'true' always;
    }

    # ── AI / ML Service ───────────────────────────────
    location /ai/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Methods     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers     'Authorization, Content-Type, Accept';
            add_header Access-Control-Allow-Credentials 'true';
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://ai_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers     'Authorization, Content-Type, Accept' always;
        add_header Access-Control-Allow-Credentials 'true' always;
    }

    # ── Health check público ──────────────────────────
    location /health {
        proxy_pass http://backend/health;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    # ── Healthcheck directo para Docker (no depende del backend) ──
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /favicon.ico { return 204; access_log off; }
    location = /robots.txt  { return 204; access_log off; }
}
